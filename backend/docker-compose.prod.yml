version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: cortex-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: cortex-gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AUTH_SERVICE=http://auth:8001
      - CHAT_SERVICE=http://chat:8002
      - AGENT_SERVICE=http://agent:8003
      - BILLING_SERVICE=http://billing:8004
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=${FRONTEND_URL}
      - NODE_ENV=production
    depends_on:
      - redis
      - auth
      - chat
      - agent
      - billing

  auth:
    build:
      context: .
      dockerfile: ./services/auth/Dockerfile
    container_name: cortex-auth
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_URL=redis://redis:6379
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - NODE_ENV=production
    depends_on:
      - redis

  chat:
    build:
      context: .
      dockerfile: ./services/chat/Dockerfile
    container_name: cortex-chat
    restart: always
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - MONGODB_URI=${MONGODB_URI}
      - NODE_ENV=production

  agent:
    build:
      context: .
      dockerfile: ./services/agent/Dockerfile
    container_name: cortex-agent
    restart: always
    ports:
      - "8003:8003"
    environment:
      - PORT=8003
      - REDIS_URL=redis://redis:6379
      - CHAT_SERVICE=http://chat:8002
      - AUTH_SERVICE=http://auth:8001
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - NODE_ENV=production
    depends_on:
      - redis

  billing:
    build:
      context: .
      dockerfile: ./services/billing/Dockerfile
    container_name: cortex-billing
    restart: always
    ports:
      - "8004:8004"
    environment:
      - PORT=8004
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - AUTH_SERVICE=http://auth:8001
      - NODE_ENV=production

volumes:
  redis_data:
