services:
  # 1. API Gateway
  - type: web
    name: cortex-gateway
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && cd gateway && npm install
    startCommand: node gateway/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: AUTH_SERVICE
        sync: false
      - key: CHAT_SERVICE
        sync: false
      - key: AGENT_SERVICE
        sync: false
      - key: BILLING_SERVICE
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # 2. Auth Service
  - type: web
    name: cortex-auth
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && cd services/auth && npm install
    startCommand: node services/auth/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false

  # 3. Chat Service
  - type: web
    name: cortex-chat
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && cd services/chat && npm install
    startCommand: node services/chat/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false

  # 4. Agent Service
  - type: web
    name: cortex-agent
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && cd services/agent && npm install
    startCommand: node services/agent/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        sync: false
      - key: CHAT_SERVICE
        sync: false
      - key: AUTH_SERVICE
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

  # 5. Billing Service
  - type: web
    name: cortex-billing
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && cd services/billing && npm install
    startCommand: node services/billing/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: AUTH_SERVICE
        sync: false
